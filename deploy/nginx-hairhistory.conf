# HairHistory nginx site.
#
#   sudo cp deploy/nginx-hairhistory.conf /etc/nginx/sites-available/hairhistory
#   sudo ln -sfn /etc/nginx/sites-available/hairhistory /etc/nginx/sites-enabled/hairhistory
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace server_name with your domain (or the EC2 public DNS name).

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_YOUR_DOMAIN_OR_EC2_PUBLIC_DNS;

    root /var/www/hairhistory;
    index index.html;

    # ------------------------------------------------------------------
    # PLAINTEXT WARNING
    # This server block is HTTP only. The hh_session cookie is HttpOnly but
    # NOT encrypted in transit here, so anyone able to observe the network
    # (public Wi-Fi, an intermediate hop) can copy it and impersonate the
    # logged-in user. Treat HTTP as a short-lived bring-up state only.
    #
    # To enable HTTPS once a domain name points at this server:
    #   sudo apt-get install -y certbot python3-certbot-nginx
    #   sudo certbot --nginx -d your.domain
    # certbot rewrites this block to listen on 443 and redirect 80 -> 443.
    # Afterwards update /etc/hairhistory/api.env so CORS_ALLOWED_ORIGINS uses
    # https://, rebuild the frontend, and restart hairhistory-api.
    # Then consider adding:
    #   add_header Strict-Transport-Security "max-age=31536000" always;
    # ------------------------------------------------------------------

    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    # Vite emits content-hashed filenames under /assets, so they can be cached
    # indefinitely; index.html must not be, or clients pin an old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # The API sets a session cookie and logs client IPs; without these the
        # backend sees every request as coming from nginx on localhost, and a
        # future https redirect/cookie-Secure decision would be made on the
        # wrong scheme.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_redirect off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # SPA fallback: client-side routes (/shares/:token etc.) have no file on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
