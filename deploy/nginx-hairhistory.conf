# HairHistory nginx site.
#
#   sudo cp deploy/nginx-hairhistory.conf /etc/nginx/sites-available/hairhistory
#   sudo ln -sfn /etc/nginx/sites-available/hairhistory /etc/nginx/sites-enabled/hairhistory
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace server_name with your domain (or the EC2 public DNS name).
#
# NOTE: everything above the server block below (map / log_format / limit_req_zone)
# is http-context configuration. This file is included from sites-enabled/, which
# itself is included from the http block, so these directives land in http.

# A share token is a bearer credential: anyone holding it can read the shared
# history. The API masks it in its own logs, but nginx logs the request line
# independently, so the token has to be stripped here as well.
map $uri $logged_uri {
    default                        $uri;
    ~^(/api/public/shares/)[^/]+$  "$1[REDACTED]";
    ~^(/api/shares/)[^/]+$         "$1[REDACTED]";
    ~^(/shares/)[^/]+$             "$1[REDACTED]";
}

log_format hairhistory_masked '$remote_addr - $remote_user [$time_local] '
                              '"$request_method $logged_uri $server_protocol" '
                              '$status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent"';

# ----------------------------------------------------------------------
# RATE LIMITING
#
# The box is a single t3.micro (1 GB RAM), so an unthrottled flood against
# /api/ is enough to take the whole service down. Three zones, because the
# endpoints have very different legitimate call rates.
#
# Zone selection is done with maps instead of nested locations: limit_req_zone
# ignores a request whose key evaluates to the empty string, so a zone keyed on
# a map only ever counts the requests that map matched. That keeps the single
# `location /api/` block (and its one copy of the proxy_set_header set) intact.
#
# $binary_remote_addr is the real client IP today because nginx terminates the
# connection itself. CAVEAT: if an ALB / CloudFront / Cloudflare is ever put in
# front, every request arrives from the proxy and all clients collapse into one
# bucket -- switch the keys to a realip-resolved address (set_real_ip_from +
# real_ip_header X-Forwarded-For) rather than trusting the header directly.
#
# Memory: 1 MB tracks ~16k IPs. Login traffic comes from few addresses, share
# readers and general API callers from more. 16 MB total is noise on 1 GB.
# ----------------------------------------------------------------------

# Credential endpoints. /api/auth/me and /api/auth/logout are deliberately NOT
# here: /me runs on every single page load, so a login-grade limit would lock
# the app out of itself. /dev-login only exists when ENV != production.
map $uri $hh_auth_limit_key {
    default                          "";
    ~^/api/auth/(google|dev-login)$  $binary_remote_addr;
}

# The only unauthenticated endpoint. One page view of /share/:token is exactly
# one call here, so even a NAT'd salon stays far below the cap. Guessing a token
# is not the threat (32 bytes of crypto/rand); unbounded scraping/replay is.
map $uri $hh_public_share_limit_key {
    default                   "";
    ~^/api/public/shares/     $binary_remote_addr;
}

# rate=10r/m + burst=5: a real login is 1 POST. Six rapid attempts (typo,
# popup closed, retry) pass instantly, then one per 6s.
limit_req_zone $hh_auth_limit_key          zone=hh_auth:1m         rate=10r/m;

# rate=1r/s + burst=10: 60 share reads per minute per IP.
limit_req_zone $hh_public_share_limit_key  zone=hh_public_share:5m rate=1r/s;

# rate=10r/s + burst=30. Measured worst case for this SPA: opening a protected
# page fires 2 concurrent calls (GET /api/auth/me from AuthProvider + the page's
# own GET /api/treatments | /api/shares | /api/treatments/:id). AuthProvider
# stays mounted, so later navigations are 1 call each, and a mutation is
# 1 write + 1 refetch. Clicking through every screen and saving a treatment is
# ~33 calls, i.e. 5x under the cap. burst=30 (not 20) because a burst=20 test
# did reject one call when a reload was mashed 12x inside one second; widening
# burst only enlarges the one-off spike allowance, while the thing that actually
# bounds a sustained flood is rate=10r/s, which is unchanged.
limit_req_zone $binary_remote_addr         zone=hh_api:10m         rate=10r/s;

# 503 is the nginx default and is wrong here: the server is healthy, the client
# is over quota.
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_YOUR_DOMAIN_OR_EC2_PUBLIC_DNS;

    root /var/www/hairhistory;
    index index.html;

    access_log /var/log/nginx/access.log hairhistory_masked;

    # ------------------------------------------------------------------
    # PLAINTEXT WARNING
    # This server block is HTTP only. The hh_session cookie is HttpOnly but
    # NOT encrypted in transit here, so anyone able to observe the network
    # (public Wi-Fi, an intermediate hop) can copy it and impersonate the
    # logged-in user. Treat HTTP as a short-lived bring-up state only.
    #
    # To enable HTTPS once a domain name points at this server:
    #   CERTBOT_EMAIL=you@example.com bash deploy/04-setup-https.sh your.domain
    # That script fixes server_name, runs certbot, and makes this block listen on
    # 443 and redirect 80 -> 443. Afterwards switch to production with:
    #   GOOGLE_CLIENT_ID=... bash deploy/05-enable-production.sh your.domain
    # ------------------------------------------------------------------

    client_max_body_size 2m;

    # ------------------------------------------------------------------
    # SECURITY HEADERS
    #
    # add_header does NOT merge across levels: a location that declares its own
    # add_header drops every inherited one. So this set is repeated verbatim in
    # /assets/, = /index.html and @rate_limited below. Keep them in sync.
    #
    # Strict-Transport-Security is intentionally short-lived for now. Browsers
    # cache HSTS and then refuse to fall back to http, so a broken/expired
    # certificate becomes an outage nobody can click through. 300s is long
    # enough to be useful and short enough to recover from. Once certbot's
    # renewal timer has survived one real renewal, raise it to 31536000 (and
    # only then consider includeSubDomains / preload, which are one-way doors).
    # Ignored by browsers over plain http, so it is harmless before 04-setup-https.
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # frame-ancestors is the modern form of X-Frame-Options; both are sent
    # because they are read by different browser generations. This CSP has
    # deliberately no script-src/connect-src: the login page loads
    # https://accounts.google.com/gsi/client and Google Identity Services then
    # injects its own scripts, iframes and XHRs. A script-src policy cannot be
    # verified locally (Google login needs a real client_id and a registered
    # origin), and getting it wrong breaks sign-in entirely. frame-ancestors
    # restricts who may embed us and affects nothing GIS does.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # Share URLs carry the token in the path (/share/:token). The default on
    # some browsers still leaks the full URL to other origins, which would hand
    # the token to any site a stylist clicks through to. origin-only is also
    # what GIS wants to see, so no-referrer is avoided.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    # Vite emits content-hashed filenames under /assets, so they can be cached
    # indefinitely; index.html must not be, or clients pin an old bundle.
    # No limit_req here: throttling the bundle would make a cold page load fail
    # for reasons that have nothing to do with API abuse.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api/ {
        # nodelay on every zone. Without it nginx queues the excess and
        # releases it at the configured rate, so the two concurrent calls a
        # protected page makes would be served seconds apart -- the SPA would
        # look broken rather than throttled. nodelay serves the whole burst
        # immediately and 429s only what exceeds it.
        limit_req zone=hh_auth          burst=5  nodelay;
        limit_req zone=hh_public_share  burst=10 nodelay;
        limit_req zone=hh_api           burst=30 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # The API sets a session cookie and logs client IPs; without these the
        # backend sees every request as coming from nginx on localhost, and a
        # future https redirect/cookie-Secure decision would be made on the
        # wrong scheme.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_redirect off;
    }

    # The SPA's axios interceptor reads {"error":{"code","message"}} out of
    # every failure, so a rate-limit rejection has to use the same envelope or
    # the user gets a blank "unexpected error".
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 429 '{"error":{"code":"rate_limited","message":"リクエストが多すぎます。少し待ってから再度お試しください。"}}';
    }

    # Unlimited on purpose: this is the systemd/monitoring probe, and a limit
    # here would turn a traffic spike into a false "API is down" alarm.
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # SPA fallback: client-side routes (/shares/:token etc.) have no file on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
